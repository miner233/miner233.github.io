site_name: miner233 的妙妙屋
site_url: https://miner233.github.io/
theme:
  name: material
  features:
    - announce.dismiss #呈现可标记为由用户读取的临时公告，可以包含一个用于取消当前公告的按钮
    - navigation.instant
    - navigation.instant.progress
    #- header.autohide  #自动隐藏
    - navigation.tracking #地址栏中的 URL 将自动更新为在目录中突出显示的活动锚点
    - navigation.tabs #顶级部分将呈现在上面视口标题下方的菜单层中，但在移动设备上保持原样
    # - navigation.tabs.sticky  #启用粘性选项卡后，导航选项卡将锁定在标题下方，并在向下滚动时始终保持可见
    - navigation.sections #启用部分后，顶级部分在边栏中呈现为1220px以上视口的组，但在移动设备上保持原样
    - navigation.top # 返回顶部的按钮 在上滑时出现
    # - navigation.footer #页脚将呈现在边栏中，但在移动设备上保持原样
    - search.suggest # 搜索输入一些字母时推荐补全整个单词
    - search.highlight # 搜索出的文章关键词加入高亮
    - search.share #搜索分享按钮
    - navigation.expand # 打开Tab时左侧目录全部展开
    - navigation.indexes #启用节索引页后，可以将文档直接附加到节
    - content.tabs.link
    - content.tooltips
    - content.code.copy #代码复制
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - toc.follow
  language: zh # 一些提示性的文字会变成中文
  palette:
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/miner233
  generator: false
repo_url: https://github.com/miner233/miner233.github.io/
plugins:
  - tags
  - blog
  - search
  - meta
markdown_extensions: #详见https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown-extensions/ 和 https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown/
  - abbr
  - attr_list
  - admonition
  - def_list
  - footnotes
  - md_in_html
  # - meta # 支持Markdown文件上方自定义标题标签等
  - pymdownx.caret
  - pymdownx.betterem
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format:
            !!python/name:pymdownx.superfences.fence_code_format # 代码块高亮插件
  - pymdownx.arithmatex: # latex支持
      generic: true
  - toc:
      permalink: true # 固定标题位置为当前位置
  - pymdownx.highlight: # 代码块高亮
      anchor_linenums: true
      linenums: true # 显示行号
      # auto_title: true # 显示编程语言名称
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - 开始:
    - 主页: index.md
    - 分类: tags.md
  - OI:
    - OI/index.md
    - 基础算法:
      - 倍增: OI/binary_lifting.md
    - 数据结构:
      - OI/data_structures/index.md
      - 并查集 DSU: OI/data_structures/dsu.md
      - ST 表: OI/data_structures/sttable.md
    - 图论: 
      - OI/graph/index.md
      - 最小生成树: OI/graph/mst.md
    - 其他:
      - C++ STL 与现代特性指北: OI/cpp_stl_wzx.md
  - Blog:
    - index: blog/index.md
  - 其他:
    - others/index.md
    - 收录: others/b.md